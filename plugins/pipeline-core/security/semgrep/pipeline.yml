      - pattern-either:
          - pattern: DocumentBuilderFactory.newInstance()
          - pattern: SAXParserFactory.newInstance()
          - pattern: XMLInputFactory.newInstance()
          - pattern: XMLInputFactory.newFactory()
      - pattern-not-inside: |
          fun $M(...): $RT {
            ...
            $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
            ...
          }
      - pattern-not-inside: |
          fun $M(...) {
            ...
            $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
            ...
          }
      - pattern-not-inside: |
          fun $M(...): $RT {
            ...
            $F.setProperty(XMLInputFactory.SUPPORT_DTD, false)
            ...
          }
      - pattern-not-inside: |
          fun $M(...) {
            ...
            $F.setProperty(XMLInputFactory.SUPPORT_DTD, false)
            ...
          }
      - pattern-not-inside: |
          fun $M(...): $RT {
            ...
            $F.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "")
            ...
          }
      - pattern-not-inside: |
          fun $M(...) {
            ...
            $F.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "")
            ...
          }
  - id: pipeline-kotlin-path-traversal
    languages: [kotlin]
    severity: ERROR
    mode: taint
    message: >-
      A request value reaches a file path. A value such as ../../etc/passwd then reads or writes outside the intended directory. Reduce
      it to a file name (File(name).name) or check the normalized path stays under the base directory.
    metadata: {category: security, cwe: "CWE-22: Path Traversal", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $M(..., @$A(...) $P: $T, ...): $RT { ... }
              - pattern-inside: |
                  fun $M(..., @$A $P: $T, ...): $RT { ... }
              - pattern-inside: |
                  fun $M(..., @$A(...) $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $M(..., @$A $P: $T, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|RequestPart|QueryParam|PathParam|FormParam|HeaderParam)$
          # A number, a flag, a UUID or a date cannot carry ../ or a host name.
          - metavariable-regex:
              metavariable: $T
              regex: '^(?!(?:int|long|short|byte|boolean|double|float|Int|Integer|Long|Short|Byte|Boolean|Double|Float|UUID|java\.util\.UUID|BigDecimal|BigInteger|LocalDate|LocalDateTime|Instant|OffsetDateTime)\??$)'
          - pattern: $P
      - pattern: $REQ.getParameter(...)
      - pattern: $CALL.request.queryParameters[...]
      - pattern: $CALL.parameters[...]
    # The sink is the file ACCESS, not the building of a path (File(...), resolve): a path checked to stay under the base is cleaned by
    # that check before it reaches an access.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: FileInputStream($P, ...)
              - pattern: FileOutputStream($P, ...)
              - pattern: FileReader($P, ...)
              - pattern: FileWriter($P, ...)
              - pattern: Files.$FN($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: $F.$ACCESS(...)
          - metavariable-regex:
              metavariable: $ACCESS
              regex: ^(readBytes|readText|readLines|writeText|writeBytes|appendText|appendBytes|delete|deleteRecursively|inputStream|outputStream|bufferedReader|bufferedWriter|reader|writer|forEachLine|useLines|copyTo|renameTo)$
          - focus-metavariable: $F
    pattern-sanitizers:
      - pattern: FilenameUtils.getName(...)
      - pattern: File(...).name
      # A URL is not a file path (URL(...).readText() is the SSRF rule's business).
      - pattern: URL(...)
      - pattern: URI(...)
      - pattern: URI.create(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X.startsWith(...)
              - pattern: $X.canonicalPath.startsWith(...)
              - pattern: $X.canonicalFile.startsWith(...)
              - pattern: $X.normalize().startsWith(...)
          - focus-metavariable: $X
  - id: pipeline-kotlin-ssrf
    languages: [kotlin]
    severity: ERROR
    mode: taint
    message: >-
      A request value decides which URL the server calls. An attacker can then make the server reach internal hosts or cloud metadata
      (SSRF). Map the input to an allowlisted host or path instead of passing a URL through.
    metadata: {category: security, cwe: "CWE-918: Server-Side Request Forgery", confidence: MEDIUM}
    paths:
