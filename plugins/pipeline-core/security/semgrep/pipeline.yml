        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  fun $M(..., @$A(...) $P: $T, ...): $RT { ... }
              - pattern-inside: |
                  fun $M(..., @$A $P: $T, ...): $RT { ... }
              - pattern-inside: |
                  fun $M(..., @$A(...) $P: $T, ...) { ... }
              - pattern-inside: |
                  fun $M(..., @$A $P: $T, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|RequestPart|QueryParam|PathParam|FormParam|HeaderParam)$
          # A number, a flag, a UUID or a date cannot carry ../ or a host name.
          - metavariable-regex:
              metavariable: $T
              regex: '^(?!(?:int|long|short|byte|boolean|double|float|Int|Integer|Long|Short|Byte|Boolean|Double|Float|UUID|java\.util\.UUID|BigDecimal|BigInteger|LocalDate|LocalDateTime|Instant|OffsetDateTime)\??$)'
          - pattern: $P
      - pattern: $REQ.getParameter(...)
      - pattern: $CALL.request.queryParameters[...]
      - pattern: $CALL.parameters[...]
    pattern-sinks:
      # The URL argument is the sink; one that starts with a literal scheme, host and "/" fixes the host and does not count.
      - patterns:
          - pattern-either:
              - pattern: URL($U)
              - pattern: URI($U)
              - pattern: URI.create($U)
              - pattern: $C.getForObject($U, ...)
              - pattern: $C.getForEntity($U, ...)
              - pattern: $C.postForObject($U, ...)
              - pattern: $C.exchange($U, ...)
              - pattern: $C.uri($U, ...)
              - pattern: Request.Builder().url($U)
              - pattern: $C.get(urlString = $U)
          - metavariable-regex:
              metavariable: $U
              regex: '^(?!"https?://[^"/$]+/)'
          - focus-metavariable: $U
  - id: pipeline-kotlin-weak-crypto
    languages: [kotlin]
    severity: WARNING
    message: >-
      A broken hash or cipher (MD5, SHA-1, DES, 3DES, RC2, RC4, Blowfish) or the ECB mode (also the default of a bare "AES") is used.
      Use SHA-256 or better, and AES-GCM.
