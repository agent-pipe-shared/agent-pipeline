    metadata: {category: security, cwe: "CWE-918: Server-Side Request Forgery", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $REQUEST->input(...)
      - pattern: $REQUEST->query(...)
    pattern-sinks:
      # The URL argument is the sink; one that starts with a literal scheme, host and "/" fixes the host and does not count.
      - patterns:
          - pattern-either:
              - pattern: curl_init($U)
              - pattern: curl_setopt($C, CURLOPT_URL, $U)
              - pattern: $CLIENT->request($M, $U, ...)
              - pattern: Http::get($U, ...)
              - pattern: Http::post($U, ...)
          - metavariable-regex:
              metavariable: $U
              regex: '^(?!["'']https?://[^"''/$]+/)'
          - focus-metavariable: $U
  - id: pipeline-php-weak-crypto
    languages: [php]
    severity: WARNING
    message: >-
      A broken hash or cipher (MD5, SHA-1, DES, RC4) or the ECB mode is used for a security purpose. Use hash('sha256') or
      password_hash() and AES-GCM.
    metadata: {category: security, cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm", confidence: LOW}
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)
      - patterns:
          - pattern-either:
              - pattern: hash($ALG, ...)
              - pattern: openssl_encrypt($D, $ALG, ...)
              - pattern: openssl_decrypt($D, $ALG, ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: '(?i)^["''](?:md4|md5|sha1|des[a-z0-9-]*|rc2[a-z0-9-]*|rc4[a-z0-9-]*|bf[a-z0-9-]*|[a-z0-9-]*-ecb)["'']$'

  # ----- Ruby -----
  - id: pipeline-ruby-sql-injection
    languages: [ruby]
    severity: ERROR
    message: >-
      A SQL fragment is built with string interpolation or concatenation and handed to where/order/find_by_sql/execute. Use bound
      parameters (where("name = ?", name), sanitize_sql) instead.
    metadata: {category: security, cwe: "CWE-89: SQL Injection", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - patterns:
          - pattern: $M.$EXEC($Q, ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(where|having|order|reorder|group|joins|from|pluck|lock|find_by|delete_all|update_all|destroy_all|exists\?)$
          - metavariable-regex:
              metavariable: $Q
              regex: '(?s)^(?:"[^"]*#\{|["''][^"'']*["'']\s*\+\s*[^"''\s])'
      - patterns:
          - pattern-either:
              - pattern: $M.$EXEC($Q, ...)
              - patterns:
                  - pattern-inside: |
                      $V = $Q
                      ...
                  - pattern: $M.$EXEC($V, ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(execute|exec_query|exec_update|exec_delete|exec_insert|find_by_sql|count_by_sql|select_all|select_one|select_value|select_values|select_rows)$
          - metavariable-regex:
              metavariable: $Q
              regex: '(?is)^(?:"\s*(?:select|insert|update|delete|merge|with|call|exec)\b[^"]*#\{|["'']\s*(?:select|insert|update|delete|merge|with|call|exec)\b[^"'']*["'']\s*\+\s*[^"''\s])'
  - id: pipeline-ruby-command-injection
    languages: [ruby]
    severity: ERROR
    message: >-
      A shell runs a command line built with interpolation, concatenation or a variable (system, exec, backticks, %x, IO.popen, Open3
      with one string). Pass the program and its arguments separately so no shell is involved.
    metadata: {category: security, cwe: "CWE-78: OS Command Injection", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: system($CMD)
              - pattern: exec($CMD)
              - pattern: spawn($CMD)
              - pattern: IO.popen($CMD, ...)
              - pattern: Open3.capture2($CMD)
              - pattern: Open3.capture2e($CMD)
              - pattern: Open3.capture3($CMD)
              - pattern: Open3.popen3($CMD)
          - metavariable-regex:
              metavariable: $CMD
              regex: '^(?!''[^'']*''$|"[^"#]*"$|\[)'
      - pattern-regex: '(?m)^[^#\n]*(?:`[^`\n]*#\{[^`\n]*`|%x[\(\{\[][^\n]*#\{)'
  - id: pipeline-ruby-insecure-deserialization
    languages: [ruby]
    severity: ERROR
    message: >-
      Marshal.load, YAML/Psych unsafe_load or Oj object mode turn the input into arbitrary objects, which is remote code execution on
      untrusted data. Use JSON or YAML.safe_load.
    metadata: {category: security, cwe: "CWE-502: Deserialization of Untrusted Data", confidence: HIGH}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - pattern: Marshal.load(...)
      - pattern: Marshal.restore(...)
      - pattern: YAML.unsafe_load(...)
      - pattern: Psych.unsafe_load(...)
      - pattern: Oj.object_load(...)
      - pattern: 'Oj.load(..., mode: :object, ...)'
  - id: pipeline-ruby-tls-verification-disabled
    languages: [ruby]
    severity: ERROR
    message: >-
      Certificate verification is switched off (OpenSSL::SSL::VERIFY_NONE, verify false). Any network attacker can then read and
      change the traffic. Keep VERIFY_PEER.
    metadata: {category: security, cwe: "CWE-295: Improper Certificate Validation", confidence: HIGH}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - pattern: OpenSSL::SSL::VERIFY_NONE
      - pattern: 'Faraday.new(..., ssl: {verify: false}, ...)'
      - pattern: 'HTTParty.$M(..., verify: false, ...)'
  - id: pipeline-ruby-xxe
    languages: [ruby]
    severity: ERROR
    message: >-
      The XML parser is told to substitute entities or load the DTD (NOENT, DTDLOAD), so a document can read local files or reach
      internal hosts (XXE). Parse with the default options.
    metadata: {category: security, cwe: "CWE-611: Improper Restriction of XML External Entity Reference", confidence: HIGH}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - pattern: Nokogiri::XML::ParseOptions::NOENT
      - pattern: Nokogiri::XML::ParseOptions::DTDLOAD
      - pattern: LibXML::XML::Parser::Options::NOENT
      - pattern: $CONFIG.noent
      - pattern: $CONFIG.dtdload
  - id: pipeline-ruby-path-traversal
    languages: [ruby]
    severity: ERROR
    mode: taint
    message: >-
      A request value reaches a file path. A value such as ../../etc/passwd then reads or writes outside the intended directory. Reduce
      it to a file name (File.basename) or check the expanded path stays under the base directory.
    metadata: {category: security, cwe: "CWE-22: Path Traversal", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-sources:
      - pattern: params
      - pattern: cookies
      - pattern: request.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: File.read($P, ...)
              - pattern: File.open($P, ...)
              - pattern: File.new($P, ...)
              - pattern: File.write($P, ...)
              - pattern: File.delete($P, ...)
              - pattern: File.binread($P, ...)
              - pattern: IO.read($P, ...)
              - pattern: FileUtils.rm_rf($P, ...)
              - pattern: send_file($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: File.basename(...)
      # The containment check the message recommends: the expanded path checked to stay under the base directory.
      - by-side-effect: true
        patterns:
          - pattern: $X.start_with?(...)
          - focus-metavariable: $X
  - id: pipeline-ruby-ssrf
    languages: [ruby]
    severity: ERROR
    mode: taint
    message: >-
      A request value decides which URL the server calls. An attacker can then make the server reach internal hosts or cloud metadata
      (SSRF). Map the input to an allowlisted host or path instead of passing a URL through.
    metadata: {category: security, cwe: "CWE-918: Server-Side Request Forgery", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-sources:
      - pattern: params
      - pattern: cookies
      - pattern: request.params
    pattern-sinks:
      # The URL argument is the sink; one that starts with a literal scheme, host and "/" fixes the host and does not count.
      - patterns:
          - pattern-either:
              - pattern: URI($U)
              - pattern: URI.parse($U)
              - pattern: URI.open($U, ...)
              - pattern: Net::HTTP.get($U, ...)
              - pattern: Net::HTTP.get_response($U, ...)
              - pattern: HTTParty.$M($U, ...)
              - pattern: Faraday.$M($U, ...)
              - pattern: RestClient.$M($U, ...)
          - metavariable-regex:
              metavariable: $U
              regex: '^(?!(?:URI(?:\.parse)?\(\s*)?["'']https?://[^"''/#]+/)'
          - focus-metavariable: $U
  - id: pipeline-ruby-weak-crypto
    languages: [ruby]
    severity: WARNING
    message: >-
      A broken hash or cipher (MD5, SHA-1, DES, RC4) or the ECB mode is used. Use SHA-256 or better and AES-GCM.
    metadata: {category: security, cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm", confidence: MEDIUM}
    pattern-either:
      - pattern: Digest::MD5.$M(...)
      - pattern: Digest::SHA1.$M(...)
      - pattern: OpenSSL::Digest::MD5.new(...)
      - pattern: OpenSSL::Digest::SHA1.new(...)
      - patterns:
          - pattern-either:
              - pattern: OpenSSL::Digest.new($ALG)
              - pattern: OpenSSL::Cipher.new($ALG)
          - metavariable-regex:
              metavariable: $ALG
              regex: '(?i)^["''](?:md4|md5|sha1|des[a-z0-9-]*|rc2[a-z0-9-]*|rc4[a-z0-9-]*|bf[a-z0-9-]*|[a-z0-9-]*-ecb)["'']$'
