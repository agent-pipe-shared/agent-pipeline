# Plugin-shipped DEFAULT semgrep ruleset (NVA-B-SCANNER; relocated here by
# NVA-R18-SCANBOOT, 2026-08-29, to match the backlog item's own path).
#
# security-scan.mjs's buildAdapterConfig() passes this file's absolute path as
# semgrep's `--config` ONLY when a hosted project configures no
# `security.scanners.semgrep.rules_dir` of its own -- see that function's doc
# comment for the exact precedence. Deliberately minimal and fully offline:
# semgrep's own "auto" fallback needs registry/metrics network access and was
# MEASURED (2026-08-28) to fail outright with `SEMGREP_SEND_METRICS=off` (the
# fixed env every adapter invocation sets) -- "Cannot create auto config when
# metrics are off. Please allow metrics or run with a specific config." A
# project that never configures its own rules_dir must still get a working,
# deterministic, network-free scan rather than a guaranteed ERROR. A project
# that wants a deeper ruleset ships its own rules_dir; this is a floor, not a
# ceiling.
#
# Severity mapping (semgrep.mjs, unchanged by this file): ERROR -> high,
# WARNING -> medium, INFO -> info. Default `security.thresholds.block_on` is
# ["critical", "high"], so the ERROR-severity rules below block by default and
# the WARNING-severity rules surface as visible, non-blocking findings. Since
# ADR-0093 an ERROR finding blocks a close only when the feature introduced it;
# an older one is listed, not blocking. ADR-0094 records which classes are ERROR.
rules:
  - id: pipeline-default-hardcoded-private-key
    languages: [generic]
    severity: ERROR
    message: >-
      A PEM-format private key block appears to be committed to source
      control. Rotate the key immediately and remove it from history.
    metadata:
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: |
              -----BEGIN $KEYTYPE PRIVATE KEY-----
          - pattern: |
              -----BEGIN PRIVATE KEY-----
  - id: pipeline-default-dynamic-code-eval
    languages: [javascript, typescript, python]
    severity: WARNING
    message: >-
      Dynamic evaluation of a runtime string (eval/exec) is a common
      injection vector. Prefer an explicit, non-evaluated code path.
    metadata:
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  # ---------------------------------------------------------------------------
  # C28 (AC-108, PO decision 2026-11-10): the default web/Node pack -- the common OWASP classes for browser and Node code. Plain Semgrep rules, no new
  # tool. Every heuristic rule in this web/Node block is WARNING (medium, non-blocking under the default block_on); only a provider-shaped hard-coded
  # secret is ERROR, like the private-key rule above. (C28e reverses the old "a default pack never newly blocks" stance for the severe classes below,
  # PO tiles 2026-11-12, ADR-0094; these web/Node rules keep their severity.) Each rule has a positive and a negative fixture in
  # config/security/semgrep-default-rules.test.mjs.
  # ---------------------------------------------------------------------------
  - id: pipeline-default-dom-injection-sink
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A non-literal value reaches a DOM injection sink (innerHTML, outerHTML, insertAdjacentHTML, document.write). Use textContent or build nodes
      explicitly, or sanitise the value first.
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: $EL.insertAdjacentHTML($POS, $X)
          - pattern: document.write($X)
          - pattern: document.writeln($X)
      - metavariable-regex:
          metavariable: $X
          regex: '^(?!\s*["''][^"'']*["'']\s*$)'
  - id: pipeline-default-eval-like-call
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Dynamic code from a string (new Function, a string passed to setTimeout/setInterval, window.eval) is an injection vector. Pass a function instead.
    metadata:
      category: security
      cwe: "CWE-95: Eval Injection"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: new Function(...)
          - pattern: setTimeout("...", ...)
          - pattern: setInterval("...", ...)
          - pattern: $G.eval(...)
  - id: pipeline-default-unsafe-url-scheme
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A javascript: or vbscript: URL is assigned to a link, source or location. Such a scheme runs script when followed; use an https or relative URL.
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $EL.href = $V
          - pattern: $EL.src = $V
          - pattern: window.location = $V
          - pattern: location = $V
          - pattern: location.assign($V)
          - pattern: location.replace($V)
          - pattern: window.open($V, ...)
      - metavariable-regex:
          metavariable: $V
          regex: '(?i)^\s*["''`]\s*(javascript|vbscript):'
  - id: pipeline-default-unvalidated-redirect
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A non-literal value decides where the browser or the server redirects. Validate it against an allowlist of paths or origins, so that neither an
      open redirect nor a javascript: URL can be injected.
    metadata:
      category: security
      cwe: "CWE-601: Open Redirect"
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: location.href = $U
          - pattern: window.location.href = $U
          - pattern: window.location = $U
          - pattern: location.assign($U)
          - pattern: location.replace($U)
          - pattern: $RES.redirect($U)
      - metavariable-regex:
          metavariable: $U
          regex: '^(?!\s*["''][^"'']*["'']\s*$)'
  - id: pipeline-default-postmessage-no-origin-check
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A message handler never reads the sender's origin. Check event.origin against the exact expected origin before trusting event.data.
    metadata:
      category: security
      cwe: "CWE-345: Insufficient Verification of Data Authenticity"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $W.addEventListener("message", $HANDLER, ...)
          - pattern: $W.onmessage = $HANDLER
      - metavariable-pattern:
          metavariable: $HANDLER
          pattern-either:
            - pattern: ($E) => ...
            - pattern: async ($E) => ...
            - pattern: function ($E) { ... }
            - pattern: async function ($E) { ... }
      - metavariable-regex:
          metavariable: $HANDLER
          regex: '(?s)^(?!.*\.origin\b)'
  - id: pipeline-default-prototype-pollution
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A write to __proto__ or constructor.prototype, or a dynamic nested key written while iterating over an object's keys, can pollute Object.prototype.
      Reject the keys __proto__, constructor and prototype, or build the target with Object.create(null).
    metadata:
      category: security
      cwe: "CWE-1321: Prototype Pollution"
      confidence: MEDIUM
    pattern-either:
      - pattern: $O.__proto__ = $V
      - pattern: $O["__proto__"] = $V
      - pattern: $O.constructor.prototype.$P = $V
      - pattern: $O.constructor.prototype[$P] = $V
      - patterns:
          - pattern: $T[$K][$K2] = $V
          - pattern-either:
              - pattern-inside: |
                  for ($K in $S) { ... }
              - pattern-inside: |
                  for (const $K in $S) { ... }
              - pattern-inside: |
                  for (let $K in $S) { ... }
              - pattern-inside: |
                  for (var $K in $S) { ... }
  - id: pipeline-default-child-process-shell-string
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A command built from a runtime string runs through a shell (child_process exec/execSync, or spawn with shell: true), so input in it becomes a
      command. Use execFile or spawn with an argument array and no shell.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      confidence: MEDIUM
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
          - metavariable-regex:
              metavariable: $CMD
              regex: '^(?!\s*["''][^"'']*["'']\s*$)'
      - pattern: |
          child_process.spawn($CMD, $ARGS, { ..., shell: true, ... })
      - pattern: |
          child_process.spawnSync($CMD, $ARGS, { ..., shell: true, ... })
  - id: pipeline-default-hardcoded-secret
    languages: [generic]
    severity: ERROR
    message: >-
      A provider-shaped credential (cloud access key id, source-host token, chat token, payment key) appears to be committed. Revoke it, remove it from
      history and read it from the environment or a secret store.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    pattern-regex: '\b(?:AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[A-Za-z0-9]{24,}|AIza[0-9A-Za-z_-]{35})\b'
  - id: pipeline-default-hardcoded-credential-assignment
    languages: [generic]
    severity: WARNING
    message: >-
      A literal value is assigned to a name that reads like a credential (password, secret, api key, access or auth token). Read it from the environment
      or a secret store instead.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: LOW
    patterns:
      - pattern-regex: '(?i)\b(?:password|passwd|pwd|secret|api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret)["'']?\s*[:=]\s*["''][^"''\s$<>{}]{8,}["'']'
      - pattern-not-regex: '(?i)(changeme|example|placeholder|your[_-]|dummy|xxxx|process\.env|\*{3,})'

  # ---------------------------------------------------------------------------
  # C28e (PO tiles 2026-11-12, ADR-0094): the severe classes per language -- SQL injection, command injection, insecure deserialization,
  # TLS verification switched off, XML external entities, path traversal and server-side request forgery -- for Java, C#, Kotlin, Python,
  # PHP, Ruby, Go and JavaScript/TypeScript. These are ERROR (blocking under the default block_on); under ADR-0093 a finding blocks only
  # when the feature introduced it. Weak cryptography is WARNING: MD5 and SHA-1 are common for checksums that protect nothing.
  # Request-to-sink classes use Semgrep's OSS taint mode (within one function). Test code is excluded from the ERROR rules (it disables
  # TLS and builds queries on purpose and does not ship); every ERROR rule repeats the same exclude list (Semgrep's rule parser does not resolve YAML anchors). Every rule has a firing and
  # a quiet fixture in config/security/semgrep-default-rules.test.mjs.
  # ---------------------------------------------------------------------------

  # ----- Java -----
  - id: pipeline-java-sql-injection
    languages: [java]
    severity: ERROR
    message: >-
      A SQL statement is built by concatenating or formatting a runtime value into the SQL text and handed to a query call. Use a
      PreparedStatement or named parameters and bind the value.
    metadata: {category: security, cwe: "CWE-89: SQL Injection", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    patterns:
      - pattern-either:
          - pattern: $DB.$EXEC($Q, ...)
          - patterns:
              - pattern-inside: |
                  $T $V = $Q;
                  ...
              - pattern: $DB.$EXEC($V, ...)
          - patterns:
              - pattern-inside: |
                  $V = $Q;
                  ...
              - pattern: $DB.$EXEC($V, ...)
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(executeQuery|executeUpdate|executeLargeUpdate|execute|addBatch|prepareStatement|prepareCall|createQuery|createNativeQuery|createSQLQuery|query|queryForObject|queryForList|queryForMap|queryForRowSet|update|batchUpdate)$
      - metavariable-regex:
          metavariable: $Q
          regex: '(?is)^(?:"{1,3}\s*(?:select|insert|update|delete|merge|with|call|exec)\b[^"]*"{1,3}\s*\+(?:\s*"[^"]*"\s*\+)*\s*[^"\s]|String\.format\(\s*"{1,3}\s*(?:select|insert|update|delete|merge|with|call|exec)\b|"{1,3}\s*(?:select|insert|update|delete|merge|with|call|exec)\b[^"]*"{1,3}\s*\.formatted\()'
  - id: pipeline-java-command-injection
    languages: [java]
    severity: ERROR
    message: >-
      A shell is started with a command line built from a runtime value, or Runtime.exec gets a concatenated string. Run the program
      directly with an argument array and no shell, and validate the arguments.
    metadata: {category: security, cwe: "CWE-78: OS Command Injection", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: new ProcessBuilder($SH, $FLAG, $CMD, ...)
              - pattern: $R.exec(new String[]{$SH, $FLAG, $CMD, ...}, ...)
              - pattern: $R.exec(new String[]{$SH, $FLAG, $CMD, ...})
          - metavariable-regex:
              metavariable: $SH
              regex: '(?i)^"(?:[^"]*[\\/])?(?:sh|bash|zsh|ksh|dash|cmd|cmd\.exe|powershell|powershell\.exe|pwsh|pwsh\.exe)"$'
          - metavariable-regex:
              metavariable: $FLAG
              regex: '(?i)^"(?:-c|/c|-command)"$'
          - metavariable-regex:
              metavariable: $CMD
              regex: '^(?!"[^"]*"$)'
      - patterns:
          - pattern: Runtime.getRuntime().exec($C, ...)
          - metavariable-regex:
              metavariable: $C
              regex: '(?s)^"[^"]*"\s*\+'
  - id: pipeline-java-insecure-deserialization
    languages: [java]
    severity: ERROR
    message: >-
      Java serialization (ObjectInputStream, XMLDecoder) or Jackson default typing turns the bytes into arbitrary classes, which is
      remote code execution on untrusted input. Use a data format without type information, or an ObjectInputFilter allowlist.
    metadata: {category: security, cwe: "CWE-502: Deserialization of Untrusted Data", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: (ObjectInputStream $O).readObject()
              - pattern: (ObjectInputStream $O).readUnshared()
              - pattern: new ObjectInputStream(...).readObject()
          - pattern-not-inside: |
              $C(...) {
                ...
                $X.setObjectInputFilter(...);
                ...
              }
      - pattern: new XMLDecoder(...)
      - pattern: $MAPPER.enableDefaultTyping(...)
      - pattern: $MAPPER.activateDefaultTyping(LaissezFaireSubTypeValidator.instance, ...)
  - id: pipeline-java-tls-verification-disabled
    languages: [java]
    severity: ERROR
    message: >-
      Certificate or host name verification is switched off (an empty checkServerTrusted, a host name verifier that accepts every
      host, a trust-all strategy). Any network attacker can then read and change the traffic. Keep the default verification.
    metadata: {category: security, cwe: "CWE-295: Improper Certificate Validation", confidence: HIGH}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - pattern: |
          void checkServerTrusted(...) {}
      - pattern: |
          void checkServerTrusted(...) throws $E {}
      - pattern: |
          boolean verify(String $H, SSLSession $S) { return true; }
      - pattern: $C.setHostnameVerifier(($H, $S) -> true)
      - pattern: HttpsURLConnection.setDefaultHostnameVerifier(($H, $S) -> true)
      - pattern: NoopHostnameVerifier.INSTANCE
      - pattern: new NoopHostnameVerifier()
      - pattern: SSLConnectionSocketFactory.ALLOW_ALL_HOSTNAME_VERIFIER
      - pattern: TrustAllStrategy.INSTANCE
      - pattern: new TrustAllStrategy()
      - pattern: InsecureTrustManagerFactory.INSTANCE
  - id: pipeline-java-xxe
    languages: [java]
    severity: ERROR
    message: >-
      An XML parser factory is created without switching off DOCTYPE declarations, external entities or external DTD access in the same
      method or constructor, so a document can read local files or reach internal hosts (XXE). Set disallow-doctype-decl (StAX:
      SUPPORT_DTD false) or ACCESS_EXTERNAL_DTD "" right after creating the factory.
    metadata: {category: security, cwe: "CWE-611: Improper Restriction of XML External Entity Reference", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    # $C(...) { ... } matches a method and a constructor alike (measured), so hardening in either counts.
    patterns:
      - pattern-either:
          - pattern: DocumentBuilderFactory.newInstance()
          - pattern: SAXParserFactory.newInstance()
          - pattern: XMLInputFactory.newInstance()
          - pattern: XMLInputFactory.newFactory()
      - pattern-not-inside: |
          $C(...) {
            ...
            $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
            ...
          }
      - pattern-not-inside: |
          $C(...) {
            ...
            $F.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
            ...
          }
      - pattern-not-inside: |
          $C(...) {
            ...
            $F.setFeature("http://xml.org/sax/features/external-general-entities", false);
            ...
          }
      - pattern-not-inside: |
          $C(...) {
            ...
            $F.setProperty(XMLInputFactory.SUPPORT_DTD, false);
            ...
          }
      - pattern-not-inside: |
          $C(...) {
            ...
            $F.setProperty("javax.xml.stream.supportDTD", false);
            ...
          }
      - pattern-not-inside: |
          $C(...) {
            ...
            $F.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
            ...
          }
      - pattern-not-inside: |
          $C(...) {
            ...
            $F.setAttribute(XMLConstants.ACCESS_EXTERNAL_DTD, "");
            ...
          }
      - pattern-not-inside: |
          $C(...) {
            ...
            $F.setProperty(XMLConstants.ACCESS_EXTERNAL_DTD, "");
            ...
          }
  - id: pipeline-java-path-traversal
    languages: [java]
    severity: ERROR
    mode: taint
    message: >-
      A request value reaches a file path. A value such as ../../etc/passwd then reads or writes outside the intended directory. Reduce
      it to a file name (FilenameUtils.getName) or check the normalized path stays under the base directory.
    metadata: {category: security, cwe: "CWE-22: Path Traversal", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RT $M(..., @$A(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RT $M(..., @$A $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|RequestPart|QueryParam|PathParam|FormParam|HeaderParam)$
          # A number, a flag, a UUID or a date cannot carry ../ or a host name.
          - metavariable-regex:
              metavariable: $T
              regex: '^(?!(?:int|long|short|byte|boolean|double|float|Int|Integer|Long|Short|Byte|Boolean|Double|Float|UUID|java\.util\.UUID|BigDecimal|BigInteger|LocalDate|LocalDateTime|Instant|OffsetDateTime)\??$)'
          - pattern: $P
      - pattern: (HttpServletRequest $REQ).getParameter(...)
      - pattern: (HttpServletRequest $REQ).getParameterValues(...)
      - pattern: (HttpServletRequest $REQ).getHeader(...)
      - pattern: (HttpServletRequest $REQ).getPathInfo()
    # The sink is the file ACCESS, not the building of a path: a path built with Paths.get/resolve and then checked to stay under the base
    # (the containment check this message recommends) is cleaned by that check before it reaches an access.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new FileInputStream($P, ...)
              - pattern: new FileOutputStream($P, ...)
              - pattern: new FileReader($P, ...)
              - pattern: new FileWriter($P, ...)
              - pattern: new RandomAccessFile($P, ...)
              - pattern: Files.$FN($P, ...)
          - focus-metavariable: $P
      - patterns:
          - pattern: (File $F).$ACCESS(...)
          - metavariable-regex:
              metavariable: $ACCESS
              regex: ^(delete|renameTo|createNewFile|mkdirs|listFiles)$
          - focus-metavariable: $F
    pattern-sanitizers:
      - pattern: FilenameUtils.getName(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $X.startsWith(...)
              - pattern: $X.getCanonicalPath().startsWith(...)
              - pattern: $X.toRealPath(...).startsWith(...)
          - focus-metavariable: $X
  - id: pipeline-java-ssrf
    languages: [java]
    severity: ERROR
    mode: taint
    message: >-
      A request value decides which URL the server calls. An attacker can then make the server reach internal hosts or cloud metadata
      (SSRF). Map the input to an allowlisted host or path instead of passing a URL through.
    metadata: {category: security, cwe: "CWE-918: Server-Side Request Forgery", confidence: MEDIUM}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RT $M(..., @$A(...) $T $P, ...) { ... }
              - pattern-inside: |
                  $RT $M(..., @$A $T $P, ...) { ... }
          - metavariable-regex:
              metavariable: $A
              regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|RequestPart|QueryParam|PathParam|FormParam|HeaderParam)$
          # A number, a flag, a UUID or a date cannot carry ../ or a host name.
          - metavariable-regex:
              metavariable: $T
              regex: '^(?!(?:int|long|short|byte|boolean|double|float|Int|Integer|Long|Short|Byte|Boolean|Double|Float|UUID|java\.util\.UUID|BigDecimal|BigInteger|LocalDate|LocalDateTime|Instant|OffsetDateTime)\??$)'
          - pattern: $P
      - pattern: (HttpServletRequest $REQ).getParameter(...)
      - pattern: (HttpServletRequest $REQ).getParameterValues(...)
      - pattern: (HttpServletRequest $REQ).getHeader(...)
      - pattern: (HttpServletRequest $REQ).getPathInfo()
    pattern-sinks:
      # The URL argument is the sink; one that starts with a literal scheme, host and "/" fixes the host and does not count.
      - patterns:
          - pattern-either:
