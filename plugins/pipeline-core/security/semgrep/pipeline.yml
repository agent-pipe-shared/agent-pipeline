  - id: pipeline-php-tls-verification-disabled
    languages: [php]
    severity: ERROR
    message: >-
      Certificate or host name verification is switched off (CURLOPT_SSL_VERIFYPEER/VERIFYHOST, verify_peer, Guzzle verify false).
      Any network attacker can then read and change the traffic. Keep the verification on.
    metadata: {category: security, cwe: "CWE-295: Improper Certificate Validation", confidence: HIGH}
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**", "**/*.Tests/**", "**/*.UnitTests/**", "**/*Test.java",
        "**/*Tests.java", "**/*IT.java", "**/*Test.kt", "**/*Tests.kt", "**/*Test.cs", "**/*Tests.cs", "**/*_test.go", "**/test_*.py",
        "**/*_test.py", "**/*_spec.rb", "**/*_test.rb", "**/*Test.php", "**/*.test.*", "**/*.spec.*"]
    pattern-either:
      - pattern: curl_setopt($C, CURLOPT_SSL_VERIFYPEER, false)
      - pattern: curl_setopt($C, CURLOPT_SSL_VERIFYPEER, 0)
      - pattern: curl_setopt($C, CURLOPT_SSL_VERIFYHOST, 0)
      - pattern: curl_setopt($C, CURLOPT_SSL_VERIFYHOST, false)
      - pattern: |
          [..., 'verify_peer' => false, ...]
      - pattern: |
          [..., 'verify_peer_name' => false, ...]
      # 'verify' => false only counts as an HTTP client option (Guzzle, Laravel's Http); the key is too common in other arrays.
      - pattern: |
          new Client([..., 'verify' => false, ...])
      - pattern: |
          new \GuzzleHttp\Client([..., 'verify' => false, ...])
      - pattern: |
