# .gitleaks.toml -- path-scoped rule exemption for the hash-chained backlog ledger.
#
# Background: backlog/2026-08-08-the-hash-chained-ledger-collides-permanently-with-the-secret-scanner.md
# (PO-selected "candidate 1"). backlog/transitions.ndjson is a hash-chained, append-only ledger
# whose lines carry multiple bare 64-hex-character SHA-256 digests (entryHash, previousHash, and
# for amendment-kind events also referenceSha256/supersedesEntryHash). gitleaks' `sentry-access-token`
# rule pattern-matches that shape deterministically for amendment events (100% of the time) and
# `generic-api-key` sporadically for ordinary events (~1.6%), forcing a manually-reviewed
# .gitleaksignore suppression entry per occurrence, forever.
#
# `[extend] useDefault = true` loads gitleaks' full built-in default ruleset unchanged; the
# `[[rules]]` blocks below are matched to the built-in rules of the SAME id and MERGE an
# additional path-scoped allowlist onto them -- empirically verified (this task) to leave the
# rule's own regex/keywords/entropy logic completely untouched for every other path. Only these
# two rule IDs, and only this one path, are touched. No other rule and no other file in the
# repository is affected: both rules stay fully armed everywhere else, including a pasted real
# credential elsewhere in this same file being fully detectable.
#
# Path-matching note: gitleaks matches a rule-scoped allowlist's `paths` regex against the
# file path gitleaks itself reports (empirically the absolute filesystem path of the scanned
# source tree, not a path relative to `--source`) -- verified by testing a strict
# `^backlog/transitions\.ndjson$` anchor, which never matched, against the working
# `.*/backlog/transitions\.ndjson$` form used below (path-segment-anchored per RW2-GITLEAKSCONFIG
# below).
#
# RW2-GITLEAKSCONFIG, 2026-08-27: the `.*` prefix above is required (absolute-path prefix, see
# above) but was unanchored on its OWN right edge -- `.*backlog/transitions\.ndjson$` also
# matches any path merely ENDING in that literal substring, e.g. a directory named
# `notbacklog/transitions.ndjson` (no path-separator boundary before `backlog`), not only a
# genuine `backlog/` directory. Patterns below now require a literal `/` immediately before
# `backlog`, so only an actual `backlog` path segment can match. This does not, and (gitleaks'
# regex engine has no lookbehind) cannot, distinguish the repository's own top-level `backlog/`
# from some OTHER, differently-nested `.../backlog/transitions.ndjson` a candidate tree could in
# principle introduce elsewhere -- gitleaks reports only the absolute path, with no marker for
# "relative to --source", so a purely static regex cannot bind to "top-level only". Known,
# accepted limitation of this allowlist mechanism, not fixed by this anchor.
#
# VFX3-SECURITY, 2026-08-26: the Nova/Phoenix merge introduced a second hash-chained ledger,
# `backlog/transitions-phoenix-history.ndjson` (the Phoenix-side history carried across the
# merge; same schema, same bare-hex `entryHash`/`previousHash`/`referenceSha256`/
# `supersedesEntryHash` shape that trips these two rules). The original single-path allowlist
# below did not cover it, so its lines surfaced as 39 unignored `sentry-access-token` findings.
# Extended to both ledger files rather than filed as 39 individual .gitleaksignore entries --
# consistent with why this file exists at all (see header).
#
# What justifies exempting `transitions-phoenix-history.ndjson` specifically: unlike
# `transitions.ndjson` (live, append-only, checked by the ledger tooling on every write), the
# history file is a frozen archival copy (backlog/README.md) that nothing projects or appends to.
# `check-backlog-state.mjs`'s `checkPhoenixHistoryImmutable` pins the single top-level
# `backlog/transitions-phoenix-history.ndjson` file (`PHOENIX_HISTORY_PATH` joined to the
# repository root) to a fixed SHA-256 and blocks the gate on any drift there -- so no new
# content, secret or otherwise, can reach THAT top-level file without failing that check first.
#
# Re-Critic F1, 2026-08-27 (backlog/items/2026-08-27-phoenix-merge-re-critic-minor-findings.md):
# this pin is narrower than the exemption regex above, which -- like the RW2-GITLEAKSCONFIG
# anchor note above, but for the *pin* rather than the *anchoring* -- matches ANY nested
# `.../backlog/transitions-phoenix-history.ndjson`, not only the one top-level file the pin
# covers; a file at a nested `backlog/` segment would be exempted from these two secret rules and
# pinned by nothing. Known, accepted limitation of this allowlist mechanism (same class as
# RW2-GITLEAKSCONFIG), not fixed by this comment. The pin only ever covers bytes already scanned
# once, at merge time, for the top-level file; it does not open a lane for anything written later
# there.

[extend]
useDefault = true

[[rules]]
id = "sentry-access-token"

[[rules.allowlists]]
paths = ['''.*/backlog/transitions\.ndjson$''', '''.*/backlog/transitions-phoenix-history\.ndjson$''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
paths = ['''.*/backlog/transitions\.ndjson$''', '''.*/backlog/transitions-phoenix-history\.ndjson$''']
